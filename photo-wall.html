<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Wall — OSKR 17th Anniversary</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/logo-17.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<style>
  :root {
    --paper: #FFFDF8;
    --ink: #1B2130;
    --navy: #21407D;
    --blue: #2E7FE0;
    --pink: #EF4F98;
    --bg: #0E1320;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--paper);
    font-family: 'Kanit', sans-serif;
    cursor: none;
  }

  .wall {
    display: flex;
    width: 100vw;
    height: 100vh;
    gap: 1vh;
    padding: 1vh;
  }
  .slots {
    flex: 1;
    display: flex;
    gap: 1vh;
    min-width: 0;
  }

  .slot {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    border-radius: 1.2vh;
    background: #161C2C;
  }
  .layer {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .layer.is-active { opacity: 1; }
  .layer-bg {
    position: absolute;
    inset: -8%;
    background-size: cover;
    background-position: center;
    filter: blur(40px) brightness(0.45) saturate(1.2);
  }
  .layer-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .layer.is-active .layer-img { animation: slow-zoom 12s ease-out forwards; }
  @keyframes slow-zoom {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
  }
  .layer-caption {
    position: absolute;
    left: 1.6vh;
    bottom: 1.4vh;
    padding: 0.5vh 1.4vh;
    border-radius: 999px;
    background: rgba(14, 19, 32, 0.65);
    font-size: 2.2vh;
    font-weight: 500;
    max-width: calc(100% - 3.2vh);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .layer-caption:empty { display: none; }

  .sidebar {
    width: 16vw;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5vh;
    padding: 3vh 1.5vw;
    border-radius: 1.2vh;
    background: linear-gradient(180deg, var(--navy) 0%, #172B57 100%);
    text-align: center;
  }
  .sidebar-logo { width: 40%; max-width: 160px; }
  .sidebar-title {
    font-weight: 800;
    font-size: 4.4vh;
    line-height: 1.05;
    letter-spacing: 0.02em;
  }
  .sidebar-title span { color: var(--pink); }
  .hashtag {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--pink);
    font-size: 2.1vh;
    word-break: break-all;
  }
  .qr {
    background: #fff;
    padding: 1.2vh;
    border-radius: 1.2vh;
    line-height: 0;
  }
  .qr img {
    image-rendering: pixelated;
    display: block;
  }
  .sidebar .qr img { width: 12vw; height: 12vw; max-width: 30vh; max-height: 30vh; }
  .qr-label { font-size: 2.6vh; font-weight: 600; line-height: 1.3; }

  .qr-badge {
    position: fixed;
    right: 2.5vh;
    bottom: 2.5vh;
    display: flex;
    align-items: center;
    gap: 1.8vh;
    padding: 1.4vh 1.4vh 1.4vh 2.2vh;
    border-radius: 1.6vh;
    background: rgba(14, 19, 32, 0.78);
    z-index: 5;
  }
  .qr-badge .qr img { width: 17vh; height: 17vh; }
  .qr-badge .qr-label { font-size: 2.4vh; text-align: right; }

  .empty {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    background: radial-gradient(circle at center, #1D2D57 0%, var(--bg) 70%);
    z-index: 10;
    text-align: center;
  }
  .empty-title { font-size: 7vh; font-weight: 800; }
  .empty .qr img { width: 32vh; height: 32vh; }
  .empty .qr-label { font-size: 3.4vh; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="wall">
  <div class="slots" id="slots"></div>
  <aside class="sidebar hidden" id="sidebar">
    <img class="sidebar-logo" src="assets/img/logo-17.png" alt="OSKR17">
    <div class="sidebar-title">TIME<br><span>MACHINE</span></div>
    <div class="hashtag">#oskr17timemachine</div>
    <div class="qr" data-qr></div>
    <div class="qr-label">สแกนเพื่อ<br>แชร์รูปขึ้นจอ</div>
  </aside>
</div>

<div class="qr-badge hidden" id="qr-badge">
  <div class="qr-label">สแกนเพื่อ<br>แชร์รูปขึ้นจอ<br><span class="hashtag">#oskr17timemachine</span></div>
  <div class="qr" data-qr></div>
</div>

<div class="empty hidden" id="empty">
  <div class="empty-title">แชร์รูปขึ้นจอ</div>
  <div class="hashtag" style="font-size:3.4vh">#oskr17timemachine</div>
  <div class="qr" data-qr></div>
  <div class="qr-label">สแกน QR เพื่อส่งรูปของคุณ</div>
</div>

<script src="assets/js/photo-wall.js"></script>
</body>
</html>
