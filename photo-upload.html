<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แชร์รูปขึ้นจอ — OSKR 17th Anniversary</title>
<meta name="description" content="แชร์รูปของคุณขึ้นจอใหญ่ในงาน OSKR 17th Anniversary — Time Machine">
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" href="assets/img/logo-17.png">
<link rel="apple-touch-icon" href="assets/img/logo-17.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper: '#FFFDF8',
          sky: '#CFE9FB',
          skysoft: '#F1F9FE',
          ink: '#1B2130',
          navy: '#21407D',
          blue: '#2E7FE0',
          pink: '#EF4F98',
        },
        fontFamily: {
          display: ['"Kanit"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
          thai: ['"Kanit"', 'sans-serif'],
        },
      },
    },
  };
</script>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-paper text-ink font-thai antialiased selection:bg-pink/40 selection:text-ink">

<nav class="sticky top-0 z-50 backdrop-blur-md bg-paper/85 border-b border-navy/10">
  <div class="max-w-2xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2 font-display font-semibold tracking-wide text-sm">
      <span class="w-7 h-7 rounded-full border border-blue/70 flex items-center justify-center text-blue text-[10px] font-mono">17</span>
      OSKR17th
    </a>
    <a href="index.html" class="text-xs uppercase tracking-widest text-ink/50 hover:text-blue transition-colors flex items-center gap-1.5">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      กลับหน้าแรก
    </a>
  </div>
</nav>

<main class="max-w-2xl mx-auto px-5 sm:px-8 py-14 sm:py-20">

  <div class="text-center mb-10">
    <p class="font-mono text-pink text-xs tracking-[0.3em] uppercase mb-3">#oskr17timemachine</p>
    <h1 class="font-display font-bold text-3xl sm:text-4xl mb-3">แชร์รูปขึ้นจอ</h1>
    <p class="text-ink/60 text-sm leading-relaxed max-w-md mx-auto">
      เลือกรูปในงานจากมือถือของคุณ แล้วรูปจะขึ้นจอใหญ่ภายในไม่กี่วินาที
    </p>
  </div>

  <div id="form-banner" class="form-banner form-banner-error hidden" role="alert"></div>

  <form id="upload-form" novalidate>

    <div class="form-field">
      <label class="form-label" for="name">ชื่อเล่น (แสดงใต้รูปบนจอ — ไม่บังคับ)</label>
      <input class="form-input" type="text" id="name" name="name" maxlength="40" placeholder="เช่น ต้น ห้อง 6/3" autocomplete="nickname">
    </div>

    <div class="form-field">
      <label class="form-label">รูปภาพ <span class="required">*</span></label>
      <label for="photos" id="dropzone" class="upload-dropzone block">
        <svg class="w-8 h-8 mx-auto mb-2 text-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5V18a2.25 2.25 0 002.25 2.25h13.5A2.25 2.25 0 0021 18v-1.5M16.5 7.5L12 3m0 0L7.5 7.5M12 3v13.5"/></svg>
        <span class="text-sm text-ink/70">แตะเพื่อเลือกรูป (สูงสุด 10 รูป)</span>
      </label>
      <input type="file" id="photos" accept="image/*" multiple class="hidden">
      <div id="preview-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-3"></div>
    </div>

    <div class="form-field">
      <label class="form-checkbox-row text-sm text-ink/70">
        <input type="checkbox" id="consent">
        <span>ฉันยินยอมให้แสดงรูปนี้บนจอในงาน และยืนยันว่าบุคคลในรูปยินดีให้แสดง</span>
      </label>
    </div>

    <button type="submit" id="submit-btn" class="btn-submit mt-4">
      <span id="submit-btn-label">ส่งรูปขึ้นจอ</span>
    </button>
  </form>

  <div id="upload-success" class="hidden text-center py-10">
    <div class="w-16 h-16 rounded-full bg-blue/10 text-blue flex items-center justify-center mx-auto mb-5">
      <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h2 class="font-display font-bold text-2xl mb-2">ส่งรูปสำเร็จ!</h2>
    <p id="upload-success-text" class="text-ink/60 text-sm mb-6">รูปของคุณจะขึ้นจอใหญ่ภายในไม่กี่วินาที</p>
    <button type="button" id="upload-again-btn" class="text-sm text-blue hover:underline">ส่งรูปเพิ่ม</button>
  </div>

</main>

<script src="assets/js/photo-upload.js"></script>
</body>
</html>
